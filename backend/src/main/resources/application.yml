server:
  port: ${PORT:8080}

spring:
  application:
    name: TheBigBazaar
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shopsphere}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Siva@1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
    generate-ddl: false





app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email:
    provider:
      api-url: ${APP_EMAIL_PROVIDER_API_URL:https://api.resend.com/emails}
      api-key: ${APP_EMAIL_PROVIDER_API_KEY:}
      sender-email: ${APP_EMAIL_PROVIDER_SENDER_EMAIL:noreply@thebigbazaar.com}
  payments:
    currency: ${PAYMENT_CURRENCY:INR}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}


# Production deployments should supply DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD
# via environment variables and should use database migrations such as Flyway in a later phase.
# PostgreSQL tables are expected to follow snake_case naming via Hibernate's default Spring Boot
# naming strategy, and future entities will generally use UUID identifiers mapped to PostgreSQL's
# native uuid type.
